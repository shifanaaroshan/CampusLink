<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusLink - Resource</title>

    <link rel="stylesheet"
        href="../css/style.css">

</head>

<body>

<div class="resource-page">

    <div class="resource-header">

        <h1 id="resourceTitle">
            Java Programming Notes
        </h1>

        <p id="resourceCategory">
            📄 Notes
        </p>

        <p id="viewCount">
            👁 128 Views
        </p>

    </div>

    <div class="resource-info">

        <p>

            <strong>Uploaded By:</strong>

            <span id="uploadedBy">

                Student Contributor

            </span>

        </p>

        <p>

            <strong>Department:</strong>

            <span id="department">

                Computer Science

            </span>

        </p>

        <p>

            <strong>Description:</strong>

        </p>

        <p id="resourceDescription">

            Complete Java Programming notes including OOP concepts, inheritance, exception handling and collections.

        </p>

    </div>

    <div class="resource-actions">

        <button id="downloadBtn">

            📥 Download

        </button>

        <button id="saveBtn">

            ❤️ Save

        </button>

        <button id="shareBtn">

            📤 Share

        </button>

    </div>

    <div class="comments-section">

        <h3>Comments</h3>

        <textarea
            id="commentInput"
            placeholder="Write a comment...">
        </textarea>

        <button id="commentBtn">

            Post Comment

        </button>

        <div id="commentsList">

        </div>

    </div>

</div>

</nav>

</body>
</html>
